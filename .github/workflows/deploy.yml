# Build the site and deploy it to GitHub Pages at https://medhinioak.dev.
# Fails before deploying if any built text file contains 'PLACEHOLDER:'. See docs/runbook.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job gets Pages and OIDC rights; the build job runs third-party install scripts.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Fail if a PLACEHOLDER marker is in the built site
        run: |
          # PLACEHOLDER%3A is the marker URL-encoded, as in a mailto: subject.
          if grep -rlIE 'PLACEHOLDER(:|%3A)' apps/site/dist; then
            echo "::error::'PLACEHOLDER:' found in the files listed above"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
